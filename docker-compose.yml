# 사용법
#   DB 실행        : docker compose up -d db
#   파이프라인 실행 : docker compose run --rm pipeline --quarter 20252 --building-file 건축물대장.csv --parking-file 주차장.csv
#   (pipeline은 profiles: batch라서 up 할 때 같이 뜨지 않고, run으로 한 번 실행 후 종료)

services:
  db:
    build: ./docker/db
    image: nailmap-db
    container_name: nailmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # 로컬 Spring Boot·DB 툴 접속용 (외부 노출 안 함)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build: ./data
    image: nailmap-pipeline
    profiles: ["batch"]
    env_file: .env
    environment:
      # 컨테이너 안에서는 localhost가 아니라 서비스 이름(db)으로 접속
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./data/references:/app/references:ro   # 건축물대장·도로명주소·주차장 원본 파일 (읽기 전용)
      - pipeline_cache:/app/.cache        # admdongkor 등 다운로드 캐시
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pipeline_cache:
